name: Claude advisor contribution validation
on:
  push:
    branches: [test/claude-advisor-validation-20261005]
permissions:
  contents: read
jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 3
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: hindsight-contribution
          cache-on-failure: true
      - name: Format changed sources
        run: python scripts/advisor-contribution-validation.py format
      - name: Prove regressions and CLI fail on the base implementation
        run: python scripts/advisor-contribution-validation.py baseline
      - name: Check fixed implementation and required Rust gates
        run: python scripts/advisor-contribution-validation.py final
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: advisor-validation-${{ matrix.os }}
          path: contribution-validation
