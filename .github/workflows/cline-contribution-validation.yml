name: Cline cache test isolation validation
on:
  push:
    branches: [test/cline-input-validation-20261005]
permissions:
  contents: read
jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    env:
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: hindsight-contribution
          cache-on-failure: true
      - name: Prove inherited Cline roots break the published test
        run: python scripts/cline-test-isolation-validation.py baseline
      - name: Validate isolated cache regression and core suite
        run: python scripts/cline-test-isolation-validation.py fixed
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: cline-isolation-${{ matrix.os }}
          path: contribution-validation-isolation
