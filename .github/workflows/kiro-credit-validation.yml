name: Kiro CLI credit validation
on:
  push:
    branches: [test/kiro-turn-credits-validation-20261005]
permissions:
  contents: read
jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    env:
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: tokscale-kiro-credits
          cache-on-failure: true
      - name: Format and validate CLI credits and workspace
        run: python scripts/kiro-credit-validation.py
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: kiro-cli-credits-${{ matrix.os }}
          path: kiro-credit-validation
