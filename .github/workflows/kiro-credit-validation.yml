name: Kiro CLI credit validation
on:
  push:
    branches: [test/kiro-turn-credits-validation-20261005]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 35
    env:
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: tokscale-kiro-credits
          cache-on-failure: true
      - name: Compare inherited CLI lint and run full Windows tests
        run: python scripts/kiro-credit-validation.py
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: kiro-cli-credits-windows-complete
          path: kiro-credit-validation
